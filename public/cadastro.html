<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/login_cadastro.css" />
  <link rel="icon" href="./assets/icon/logo.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=Share+Tech+Mono&display=swap" />
</head>

<!-- <body onload="listar()"> -->
<body>
  <!--header inicio-->
  <div class="header">
        <div class="logo">
            <a href="index.html"><img src="./assets/icon/logo.png" alt="logo"></a>
        </div>

        <div class="navegacao">
            <a href="index.html#equipes">Equipes</a>
            <a href="index.html#armas_imperiais">Armas Imperiais</a>
            <a href="index.html#arcos_historia">Arcos</a>
        </div>

        <div class="voltar_inicio">
          <a href="index.html"><span style="font-size: 16px;"><</span> Voltar para o Início</a>
        </div>
        
    </div>
  <!--header fim-->

  <div class="container">
    <div class="decoracao">
      <img src="assets/imgs/img_akame.png">
    </div>
    <div class="formulario">
      <div class="titulo">Novo Recrutamento</div>

      <div class="campo">
        <label for="nome_input">Nome</label>
        <div class="container_campo">
          <input type="text" id="nome_input" placeholder="Digite seu nome">
        </div>
      </div>
      
      <div class="campo">
        <label for="user_name_input">Nome de Usuário</label>
        <div class="container_campo">
          <input type="text" id="user_name_input" placeholder="seu_username">
        </div>
      </div>

      <div class="campo">
        <label for="email_input">Email</label>
        <div class="container_campo">
          <input type="text" id="email_input" placeholder="email@exemplo.com">
        </div>
      </div>


      <div class="campo">
        <label for="senha_input">Senha</label>
        <div class="container_campo ">
            <input type="password" id="senha_input" placeholder="******">
            <button onclick="visualizacao_senha()" id="olho_visualizacao"><img src="assets/icon/olho_aberto.png" alt="" id="olho"></button>
        </div>
      </div>

      <div class="campo">
        <label for="confirmacao_senha_input">Confirmar Senha</label>
        <div class="container_campo ">
            <input type="password" id="confirmacao_senha_input" placeholder="******">
            <button onclick="visualizacao_senha2()" id="olho_visualizacao2"><img src="assets/icon/olho_aberto.png" alt="" id="olho2"></button>
        </div>
      </div>

      

      <button onclick="cadastrar()" class="botao_formulario" id="botao_cadastro_login">Criar Conta</button>
      <div id="cardErro">
        <span id="mensagem_erro"></span>
      </div>

      <div class="campo_adicional">
        <span>Já possui conta? <a href="login.html" style="text-decoration: none;" id="texto_href">ENTRAR</a></span>
      </div>

    </div>
  </div>
</body>

</html>

<script>

  function cadastrar() {
    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var usernameVar = user_name_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;


    // Validações dos inputs
    if (
      nomeVar == "" ||
      usernameVar == "" ||
      emailVar == "" ||
      senhaVar == ""
    ) {
      cardErro.style.display = "flex";
      mensagem_erro.innerHTML = "Algum campo está em branco";
      botao_cadastro_login.style.display = "none"
      
        setTimeout(Timeout_erro, 3000);
      return false;
    } 

    if(nomeVar.length <= 1){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "O nome é pequeno demais";
      botao_cadastro_login.style.display = "none"

        setTimeout(Timeout_erro, 3000);
      return false;
    } 
    
    if(!emailVar.includes('@') || !emailVar.includes('.')){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Email inválido";
      botao_cadastro_login.style.display = "none"

        setTimeout(Timeout_erro, 3000);
      return false;

    } else {
      let posicao_arroba = emailVar.indexOf("@");
      let posicao_ultimo_ponto = emailVar.lastIndexOf(".");
      
      if(posicao_arroba > posicao_ultimo_ponto){
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Email inválido";
        botao_cadastro_login.style.display = "none"

        setTimeout(Timeout_erro, 3000);
      return false;

      }
    }
    
    if(senhaVar.length < 6){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha deve ter 6 ou mais caracteres";
      botao_cadastro_login.style.display = "none"

        setTimeout(Timeout_erro, 3000);
      return false;
    } 
    
    if(senhaVar != confirmacaoSenhaVar){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não coincidem";
      botao_cadastro_login.style.display = "none"

        setTimeout(Timeout_erro, 3000);
      return false;
    } 


    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        usernameServer: usernameVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";
          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
  }

  let visualizar_senha = false
    function visualizacao_senha(){

        if(!visualizar_senha){
            senha_input.type = "text";
            visualizar_senha = true;
            olho.src = `assets/icon/olho_fechado.png`;
        } else if (visualizar_senha){
            senha_input.type = "password"
            visualizar_senha = false;
            olho.src = `assets/icon/olho_aberto.png`;
        }
    }

  let visualizar_senha2 = false
  function visualizacao_senha2(){

    if(!visualizar_senha2){
      confirmacao_senha_input.type = "text";
      visualizar_senha2 = true;
      olho2.src = `assets/icon/olho_fechado.png`;
    } else if (visualizar_senha2){
      confirmacao_senha_input.type = "password"
      visualizar_senha2 = false;
      olho2.src = `assets/icon/olho_aberto.png`;
    }
  }

</script>
