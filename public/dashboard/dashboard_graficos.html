<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="icon" href="../assets/icon/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pagina">
        
        <div class="sidebar">
            <img src="../assets/icon/logo.png" alt="" id="logo">
            <span id="hello">Olá, <span id="b_usuario">usuário</span>!</span>

            <div class="direcionadores_navegacao">
                <div class="direcionador">
                    <a href="dashboard_quiz.html">QUIZ</a>
                </div>
                <div class="direcionador">
                    <a href="dashboard_graficos.html">GRÁFICOS</a>
                </div>
                <div class="direcionador" id="sair" onclick="limparSessao()">
                    <a href="../index.html">SAIR</a>
                </div>
            </div>
        </div>

        <div class="pagina_dashboard">
            <div class="kpis">
                <div class="kpi_item">
                    <span class="titulo_kpi">Pontuação Total</span>
                    <div class="conteudo">
                        <span id="pontuacao"><span id="qtd_final_pontos"></span> pts</span>
                    </div>
                </div>
                <div class="kpi_item">
                    <span class="titulo_kpi">Acertos Último Quiz</span>
                    <div class="conteudo">
                        <span id="porcentagem_resultado"><span id="porcentagem_acertos_ultimo_quiz"></span>%</span>
                    </div>
                </div>
                <div class="kpi_item">
                    <span class="titulo_kpi">Posição Ranking</span>
                    <div class="conteudo">
                        <span id="ranking_posicao"><span id="posicao"></span>°</span>
                    </div>
                </div>
            </div>

            <div id="grafico_barra">
                <span id="titulo_grafico_barra">Porcentagem de acertos por questão de todos os usuários</span>
                <div class="cores">
                    <div class="cor">
                        <div id="azul"></div>
                        <span class="desc_cor"> >= 70%</span>
                    </div>
                    <div class="cor">
                        <div id="amarelo"></div>
                        <span class="desc_cor"> >= 30%</span>
                    </div>
                    <div class="cor">
                        <div id="vermelho" style="color: b;"></div>
                        <span class="desc_cor"> < 30%</span>
                    </div>
                </div>
                <div id="container_grafico">
                    <canvas id="porcentagem_acertos_cada_questao"></canvas>
                </div>
            </div>

        </div>
    </div>
</body>

<script src="../js/alerta.js"></script>
<script src="../js/sessao.js"></script>
<script>

    var id_usuario = sessionStorage.ID_USUARIO;
    document.getElementById('b_usuario').innerHTML = sessionStorage.USER_NAME;


    // Gráfico de porcentagem de acertos de todos os usuarios
    function obterDadosAcertosPorQuestao() {
        fetch(`/tentativa/questoes`)
            .then(function(res) {
                if (res.ok) {
                    res.json().then(function(resposta) {
                        console.log(`Dados acertos por questão: ${JSON.stringify(resposta)}`);
                        plotarGraficoAcertosPorQuestao(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function(erro) {
                console.error(`Erro ao buscar acertos por questão: ${erro.message}`);
            });
    }
        
    function plotarGraficoAcertosPorQuestao(resposta) {
    
        const dados_barra = []
        for (let i = 0; i < resposta.length; i++) {
            dados_barra.push(resposta[i].porcentagem_acertos)
        }
    
        const cores = []
        for (let i = 0; i < dados_barra.length; i++) {
            if (dados_barra[i] < 30){
                cores.push('rgb(255, 0, 0)')
            } else if (dados_barra[i] <= 70){ 
                cores.push('rgb(255, 255, 0)')
            } else{
                cores.push('rgb(0, 0, 255)')
            }
        }
    
        const grafico_acertos_questao = document.getElementById('porcentagem_acertos_cada_questao')
      new Chart(grafico_acertos_questao, {
            type: 'bar',
            data: {
                labels: ['Q1', 'Q2', 'Q3', 'Q4', 'Q5', 'Q6', 'Q7', 'Q8', 'Q9'],
                datasets: [{
                    barThickness: 20,
                    data: dados_barra,
                    backgroundColor: cores
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.3)' }, ticks: { color: '#ffffff' } },
                    y: { grid: { color: 'rgba(255,255,255,0.3)' }, ticks: { color: '#ffffff' }, max: 100 }
                }
            }
            });
    }
    
    function obterDadosUltimoQuiz() {
        fetch(`/tentativa/ultimo/${id_usuario}`)
        .then(function(res) {
            if (res.ok){
                res.json().then(function(resposta){
                    console.log(`Porcentagem de acertos do último quiz: ${JSON.stringify(resposta)}`);
                    plotarDadosUltimoQuiz(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function(erro) {
                console.error(`Erro ao buscar último quiz: ${erro.message}`);
            });
        }
        
    function plotarDadosUltimoQuiz(resposta){
        let porcentagem_formatada = (resposta.porcentagem_acerto * 100).toFixed(2);
        console.log(porcentagem_formatada)

        if(porcentagem_formatada < 30){
            porcentagem_resultado.style.color = 'red'

        } else if(porcentagem_formatada >= 30 && porcentagem_formatada < 70){
            porcentagem_resultado.style.color = 'yellow'

        } else if(porcentagem_formatada >= 70){
            porcentagem_resultado.style.color = 'blue'
        }

        porcentagem_acertos_ultimo_quiz.innerHTML = `${porcentagem_formatada}`
    }

    function obterPontuacao(){
        fetch(`/tentativa/pontuacao/${id_usuario}`)
        .then(function(res) {
            if (res.ok){
                res.json().then(function(resposta){
                    console.log(`Pontuação do usuario: ${JSON.stringify(resposta)}`);
                    plotarPontuacao(resposta);
                });
            } else{
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function(erro) {
            console.error(`Erro a pontuação: ${erro.message}`);
        });
    }

    function plotarPontuacao(resposta){
        let pontuacao_usuario = resposta.pontuacao;

        qtd_final_pontos.innerHTML = pontuacao_usuario
    }

    function obterRank(){
        fetch(`/tentativa/rank/${id_usuario}`)
        .then(function(res) {
            if(res.ok){
                res.json().then(function(resposta){
                    console.log(`O ranking do usuário é: ${JSON.stringify(resposta)}`);
                    plotarRank(resposta);
                });
            } else{
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function(erro) {
            console.error(`Erro a pontuação: ${erro.message}`);
        });
    }

    function plotarRank(resposta){
        let posicao_usuario = resposta.posicao;

        if(posicao_usuario == 1){
            ranking_posicao.style.color = 'gold'
        } else if(posicao_usuario == 2){
            ranking_posicao.style.color = 'silver'
        } else if(posicao_usuario == 3){
            ranking_posicao.style.color = 'darkorange'
        } else{
            ranking_posicao.style.color = 'white'
        }

        posicao.innerHTML = posicao_usuario
    }

    window.onload = function() {
        obterDadosAcertosPorQuestao()
        obterDadosUltimoQuiz()
        obterPontuacao()
        obterRank()
    }

</script>

</html>
