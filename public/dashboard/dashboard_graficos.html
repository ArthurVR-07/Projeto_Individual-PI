<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pagina">
        
        <div class="navegacao">
            <div class="titulo">
                <img src="../assets/icon/logo.png" alt="" id="logo">
            </div>
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
            <div class="direcionadores_navegacao">
                <div class="direcionador">
                    <a href="dashboard_quiz.html">QUIZ</a>
                </div>
                <div class="direcionador">
                    <a href="dashboard_graficos.html">GRÁFICOS</a>
                </div>
                <div class="direcionador" id="sair">
                    <a href="../index.html">SAIR</a>
                </div>
            </div>
        </div>

        <div class="graficos_dashboard">

            <div class="graficos_pizza">
                <div class="grafico_container">
                    <span class="titulo_grafico">RESULTADO ÚLTIMO QUIZ (<span id="b_usuario_grafico"></span>)</span>
                    <div class="grafico">
                        <canvas id="resultado_ultimo_quiz"></canvas>
                    </div>
                </div>

                <div class="grafico_container">
                    <span class="titulo_grafico">PORCENTAGEM ÚLTIMOS 10 QUIZ (<span id="b_usuario_grafico2"></span>)</span>
                    <div class="grafico">
                        <canvas id="porcentagem_10_quiz"></canvas>
                    </div>
                </div>
            </div>

            <div class="grafico_container">
                <span class="titulo_grafico">PORCENTAGEM DE ACERTOS DE TODOS OS USUÁRIOS (ÚLTIMOS 10 QUIZ)</span>
                <div class="grafico_barra">
                    <canvas id="porcentagem_acertos_cada_questao"></canvas>
                </div>
            </div>

        </div>





    </div>
</body>

<script src="../js/alerta.js"></script>
<script src="../js/sessao.js"></script>
<script>

    b_usuario.innerHTML = sessionStorage.USER_NAME;
    b_usuario_grafico.innerHTML = sessionStorage.USER_NAME;
    b_usuario_grafico2.innerHTML = sessionStorage.USER_NAME;
    
    // Gráfico donut
    const ultimo_quiz = [2, 7];

    const donut_ultimo_quiz = document.getElementById('resultado_ultimo_quiz');
  new Chart(donut_ultimo_quiz, {
    type: 'doughnut',
    data: {
      labels: ['Erradas', 'Certas'],
      datasets: [{
        data: ultimo_quiz,
        backgroundColor: [
            'rgb(255, 0, 0)',
            'rgb(0, 0, 255)'
        ],
        borderColor: '#12121B'
      }]
    },
    options: {
        maintainAspectRatio: false,
    }
  });

  // Gráfico donut porcentagem ultimos 10 quiz
    const ultimos_10_quiz = [32, 68];

    const donut_porcetagem_10_quiz = document.getElementById('porcentagem_10_quiz');
  new Chart(donut_porcetagem_10_quiz, {
    type: 'doughnut',
    data: {
      labels: ['Erradas', 'Certas'],
      datasets: [{
        data: ultimos_10_quiz,
        backgroundColor: [
            'rgb(255, 0, 0)',
            'rgb(0, 0, 255)'
        ],
        borderColor: '#12121B'
      }]
    },
    options: {
        maintainAspectRatio: false,
    }
  });


    // Gráfico barra porcentagem acertos de cada questão dos ultimos 50 quiz de todos os usuarios
    const dados_barra = [10, 20, 30, 40, 50, 60, 70, 100, 30]

    const cores = []
    for (let i = 0; i < dados_barra.length; i++) {
        if (dados_barra[i] <= 30) {
            cores.push('rgb(255, 0, 0)')
        } else if (dados_barra[i] <= 70) {
            cores.push('rgb(255, 255, 0)')
        } else {
            cores.push('rgb(0, 0, 255)')
        }
    }

    const porcentagem_acertos_cada_questao = document.getElementById('porcentagem_acertos_cada_questao');
  new Chart(porcentagem_acertos_cada_questao, {
    type: 'bar',
    data: {
        labels: ['Q1', 'Q2', 'Q3', 'Q4', 'Q5', 'Q6', 'Q7', 'Q8', 'Q9'],
        datasets: [{
            barPercentage: 0.5,
            barThickness: 20,
            maxBarThickness: 20,
            minBarLength: 2,
            data: dados_barra,
            backgroundColor: cores
        }]
    },
    options: {
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false }
        },
        scales: {
            x: {
                grid: {
                    color: 'rgba(255, 255, 255, 0.3)'
                },
                ticks: {
                    color: '#ffffff'
                }
            },
            y: {
                grid: {
                    color: 'rgba(255, 255, 255, 0.3)'
                },
                ticks: {
                    color: '#ffffff'
                }
            }
        }
    }
  });


</script>

</html>
