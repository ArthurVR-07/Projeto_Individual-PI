<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body onload="onloadEsconder()">
    <div class="pagina">
        
        <div class="navegacao">
            <div class="titulo">
                <img src="../assets/icon/logo.png" alt="" id="logo">
            </div>
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
            <div class="direcionadores_navegacao">
                <div class="direcionador">
                    <a href="dashboard_quiz.html">QUIZ</a>
                </div>
                <div class="direcionador">
                    <a href="dashboard_graficos.html">GRÁFICOS</a>
                </div>
                <div class="direcionador" id="sair" onclick="limparSessao()">
                    <a href="../index.html">SAIR</a>
                </div>
            </div>
        </div>

        <div class="quiz">

            <div class="alerta" id="alerta">
                <span id="titulo_alerta">AVISO</span>
                <span id="desc_alerta">O quiz se baseia somente na história do anime, não apresentando perguntas sobre o mangá, e ao iniciar você concorda estar exposto a spoilers sobre a história do anime</span>
                <button onclick="iniciarQuiz()" id="botao_iniciar_quiz">INICIAR QUIZ</button>
            </div>

            
            <div class="jogo" id="jogo">

                <div id="pontuacao" class="pontuacao">
                    <div id="pontuacaoDuranteJogo">
                        <span>Quantidade de acertos: <span id="spanCertas"></span></span>
                        <span>Quantidade de erros: <span id="spanErradas"></span></span>
                    </div>
                    <div id="pontuacaoFinalJogo">
                        <span id="pontuacaoFinal">Pontuação Final: <span id="spanPontuacaoFinal">***</span></span>
                        <span id="msgFinal">***</span>
                    </div>
                </div>
                
                <div id="infoQuestao">
                    <span>Questão <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>: <br><span id="spanQuestaoExibida"></span></span>
                </div>

                <div class="respostas">

                    <div class="opcoes">
                        <span>
                            <input type="radio" id="primeiraOpcao" name="option" value="alternativaA" />
                            <label for="primeiraOpcao" id="labelOpcaoUm"></label>
                        </span>
                        <span>
                            <input type="radio" id="segundaOpcao" name="option" value="alternativaB" />
                            <label for="segundaOpcao" id="labelOpcaoDois"></label>
                        </span>
                        <span>
                            <input type="radio" id="terceiraOpcao" name="option" value="alternativaC" />
                            <label for="terceiraOpcao" id="labelOpcaoTres"></label>
                        </span>
                        <span>
                            <input type="radio" id="quartaOpcao" name="option" value="alternativaD" />
                            <label for="quartaOpcao" id="labelOpcaoQuatro"></label>
                        </span>
                    </div>

                    <div class="botoes">
                        <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                        <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
                        <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

<script src="../js/alerta.js"></script>
<script src="../js/sessao.js"></script>
<script>

    b_usuario.innerHTML = sessionStorage.USER_NAME;
    var id_usuario = sessionStorage.ID_USUARIO;

    const listaDeQuestoes = [
        { 
            pergunta: "Qual era o objetivo inicial de Tatsumi ao ir para a capital?", 
            alternativaA: "Vingar a morte de seus pais", 
            alternativaB: "Conseguir dinheiro para salvar sua aldeia pobre", 
            alternativaC: "Se tornar um soldado do Império", 
            alternativaD: "Encontrar Akame e se juntar a Night Raid", 
            alternativaCorreta: "alternativaB" 
        },
        { 
            pergunta: "Qual é o nome da arma imperial da Akame?", 
            alternativaA: "Extase", 
            alternativaB: "Pumpkin", 
            alternativaC: "Murasame", 
            alternativaD: "Rubicante", 
            alternativaCorreta: "alternativaC" 
        },
        { 
            pergunta: "Qual habilidade especial da Murasame que a Akame possui?", 
            alternativaA: "Controla o gelo", 
            alternativaB: "Infecta o inimigo com veneno", 
            alternativaC: "Dispara projéteis de energia", 
            alternativaD: "Cria ilusões no inimigo", 
            alternativaCorreta: "alternativaB" 
        },
        { 
            pergunta: "Quem lidera os Jaegers?", 
            alternativaA: "Wave", 
            alternativaB: "Esdeath", 
            alternativaC: "Kurome", 
            alternativaD: "Run", 
            alternativaCorreta: "alternativaB" 
        },
        { 
            pergunta: "Como a participação do personagem Bulat fica marcada no anime?", 
            alternativaA: "Ele traiu a Night Raid e se juntou aos Jaegers", 
            alternativaB: "Acaba morrendo para proteger Tatsumi", 
            alternativaC: "Perdeu a memória após um combate", 
            alternativaD: "Foi morto por Esdeath durante a batalha final", 
            alternativaCorreta: "alternativaB" 
        },
        { 
            pergunta: "Qual é a relação entre Akame e Kurome, membra dos Jaegers?", 
            alternativaA: "Faziam parte da liderança do império", 
            alternativaB: "Akame é a mentora que treinou Kurome", 
            alternativaC: "São inimigas que se conheceram na capital", 
            alternativaD: "São irmãs que foram separadas na infância", 
            alternativaCorreta: "alternativaD" 
        },
        { 
            pergunta: "Qual é o destino de Mine ao longo da história?", 
            alternativaA: "Ela deserta da Night Raid para se juntar ao Exército Revolucionário", 
            alternativaB: "Ela morre após derrotar Seryu", 
            alternativaC: "Ela fica em coma após um combate extremo", 
            alternativaD: "Ela é capturada e presa por Esdeath", 
            alternativaCorreta: "alternativaB" 
        },
        { 
            pergunta: "O que o Primeiro-Ministro Honest representa na história de Akame Ga Kill?", 
            alternativaA: "Um nobre bem-intencionado que perde o controle do poder", 
            alternativaB: "A corrupção que manipula o jovem imperador para benefício próprio", 
            alternativaC: "Um antigo membro do Night Raid que virou traidor", 
            alternativaD: "O pai biológico de Esdeath", 
            alternativaCorreta: "alternativaB" 
        },
        { 
            pergunta: "Quem venceu? Jaegers ou Night Raid?", 
            alternativaA: "Jaegers", 
            alternativaB: "Empate", 
            alternativaC: "Night Raid", 
            alternativaD: "Nenhum dos dois", 
            alternativaCorreta: "alternativaC" 
        }
    ]

    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    let respostasQuestoes = []

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('alerta').style.display = "none"

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.disabled = false
        btnProx.disabled = true
        btnTentarNovamente.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD
    }

    function submeter() {
        const options = document.getElementsByName("option")
        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) { hasChecked = true; break }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            btnProx.disabled = false
            habilitarAlternativas(false)
            checarResposta()
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let desabilitar = !trueOrFalse
        primeiraOpcao.disabled = desabilitar
        segundaOpcao.disabled  = desabilitar
        terceiraOpcao.disabled = desabilitar
        quartaOpcao.disabled   = desabilitar
    }

    function avancar() {
        btnProx.disabled = true
        btnSubmeter.disabled = false
        desmarcarRadioButtons()

        if (numeroDaQuestaoAtual <= quantidadeDeQuestoes - 1) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
        limparCoresBackgroundOpcoes()
    }

    function tentarNovamente() {
        window.location.reload()
    }

    function checarResposta() {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual]
        const respostaQuestaoAtual = questaoAtual.alternativaCorreta
        const options = document.getElementsByName("option")
        let alternativaCorreta = null

        options.forEach((option) => {
            if (option.value === respostaQuestaoAtual) {
                alternativaCorreta = option.labels[0].id
            }
        })

        options.forEach((option) => {
            if (option.checked && option.value === respostaQuestaoAtual) {
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                pontuacaoFinal++; certas++
                document.getElementById("spanCertas").innerHTML = certas
                respostasQuestoes.push({ questao_id: numeroDaQuestaoAtual + 1, resultado: 1 }) // certa
                numeroDaQuestaoAtual++
            } else if (option.checked && option.value !== respostaQuestaoAtual) {
                document.getElementById(option.labels[0].id).classList.add("text-danger-with-bg")
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                tentativaIncorreta++; erradas++
                document.getElementById("spanErradas").innerHTML = erradas
                respostasQuestoes.push({ questao_id: numeroDaQuestaoAtual + 1, resultado: 0 }) // errada
                numeroDaQuestaoAtual++
            }
        })
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option")
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option")
        for (let i = 0; i < options.length; i++) { options[i].checked = false }
    }


    function finalizarJogo() {
        const porcentagem = pontuacaoFinal / quantidadeDeQuestoes
        let texto, classe

        if (porcentagem <= 0.3)                        { texto = "Parece que você não estudou...";      classe = "text-danger-with-bg" }
        else if (porcentagem > 0.3 && porcentagem < 0.9) { texto = "Pode melhorar na próxima, hein!";   classe = "text-warning-with-bg" }
        else                                            { texto = "Uau, parabéns!";                     classe = "text-success-with-bg" }

        texto += "<br> Você acertou " + Math.round(porcentagem * 100) + "% das questões."

        document.getElementById('msgFinal').innerHTML = texto
        document.getElementById('msgFinal').classList.add(classe)
        document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal

        btnProx.disabled = true
        btnSubmeter.disabled = true
        btnTentarNovamente.disabled = false


        fetch("/tentativa/salvar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            certas:     certas,
            erradas:    erradas,
            id_usuario: sessionStorage.ID_USUARIO,
            respostas:  respostasQuestoes
        })
    }).then(function(resposta) {
        if (resposta.ok) {
            console.log("Resultado salvo com sucesso!")
        } else {
            console.error("Erro ao salvar resultado")
        }
    })
    }
    
</script>
